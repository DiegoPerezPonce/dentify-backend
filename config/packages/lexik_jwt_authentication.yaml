lexik_jwt_authentication:
    secret_key: '%kernel.project_dir%/config/jwt/private.pem' # path to the private key ; either absolute or relative to config_dir
    public_key: '%kernel.project_dir%/config/jwt/public.pem'  # path to the public key ; either absolute or relative to config_dir
    pass_phrase: '%env(JWT_PASSPHRASE)%'                     # internal encode/decode key
    token_ttl: 86400 # 24 h (segundos)
